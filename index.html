<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Grades militaires – QCM</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grades">
<style>
:root{--bg:#f3f4f7;--card:#fff;--tx:#14181f;--mut:#667085;--bd:#d3d8e0;--ok:#1b8a4b;--ko:#c62839;--ac:#1f4a8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#181d26;--tx:#eef1f6;--mut:#9aa4b5;--bd:#2c3442;--ok:#37c477;--ko:#ff6b7a;--ac:#4f86e0}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#181d26;--tx:#eef1f6;--mut:#9aa4b5;--bd:#2c3442;--ok:#37c477;--ko:#ff6b7a;--ac:#4f86e0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
.ch{display:flex;gap:6px;margin-bottom:8px}
.ch button{flex:1;padding:9px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:14px}
.ch .on{background:var(--ac);border-color:var(--ac);color:#fff}
#st{color:var(--mut);font-size:14px;margin:10px 2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
#bd{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
#p{font-weight:600;margin:2px 0}
#q svg{display:block;width:min(260px,72%);margin:8px auto}
.nm{font-size:24px;font-weight:700;text-align:center;padding:26px 8px}
.o{display:grid;gap:10px}.o.g{grid-template-columns:1fr 1fr}
.o button{padding:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;font-weight:600}
.o.g button{padding:6px}.o svg{display:block;width:100%;height:auto}
.o .ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.o .ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 18%,var(--card))}
#fb{min-height:24px;margin:10px 2px;font-weight:600}
#nx{width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700}
small{display:block;color:var(--mut);margin-top:16px;font-size:12px}
</style>
</head>
<body>
<main>
<h1>Grades militaires</h1>
<div class="ch" id="cs"><button data-v="T">Terre</button><button data-v="M">Marine</button><button data-v="TM" class="on">Les deux</button></div>
<div class="ch" id="cm"><button data-v="i" class="on">Insigne → nom</button><button data-v="n">Nom → insigne</button></div>
<div id="st"></div>
<div class="card"><div id="bd"></div><div id="p"></div><div id="q"></div></div>
<div class="o" id="o"></div>
<div id="fb"></div>
<button id="nx" hidden>Suivant</button>
<small>Insignes schématiques, couleurs des armes à pied (or) ; en armes montées, or et argent sont inversés. À valider sur les textes officiels.</small>
</main>
<script>
const $=id=>document.getElementById(id);
const D=[
["T","Officiers généraux","Général d’armée","S5"],
["T","Officiers généraux","Général de corps d’armée","S4"],
["T","Officiers généraux","Général de division","S3"],
["T","Officiers généraux","Général de brigade","S2"],
["T","Officiers supérieurs","Colonel","BGGGGG"],
["T","Officiers supérieurs","Lieutenant-colonel","BGSGSG"],
["T","Officiers supérieurs","Commandant","BGSGG"],
["T","Officiers subalternes","Capitaine","BGGG"],
["T","Officiers subalternes","Lieutenant","BGG"],
["T","Officiers subalternes","Sous-lieutenant","BG"],
["T","Officiers subalternes","Aspirant","BG|sab"],
["T","Sous-officiers","Major","BG|red|top"],
["T","Sous-officiers","Adjudant-chef","BG|red"],
["T","Sous-officiers","Adjudant","BS|red"],
["T","Sous-officiers","Sergent-chef","CGGG"],
["T","Sous-officiers","Sergent","CGG"],
["T","Militaires du rang","Caporal-chef","CRRG"],
["T","Militaires du rang","Caporal","CRR"],
["T","Militaires du rang","Soldat de 1re classe","CR"],
["M","Officiers généraux","Amiral","S5"],
["M","Officiers généraux","Vice-amiral d’escadre","S4"],
["M","Officiers généraux","Vice-amiral","S3"],
["M","Officiers généraux","Contre-amiral","S2"],
["M","Officiers supérieurs","Capitaine de vaisseau","BGGGGG"],
["M","Officiers supérieurs","Capitaine de frégate","BGSGSG"],
["M","Officiers supérieurs","Capitaine de corvette","BGGGG"],
["M","Officiers subalternes","Lieutenant de vaisseau","BGGG"],
["M","Officiers subalternes","Enseigne de vaisseau de 1re classe","BGG"],
["M","Officiers subalternes","Enseigne de vaisseau de 2e classe","BG"],
["M","Officiers subalternes","Aspirant","BG|sab"],
["M","Officiers mariniers","Major","BG|so2|anc"],
["M","Officiers mariniers","Maître principal","BG|so2"],
["M","Officiers mariniers","Premier maître","BG|so1"],
["M","Officiers mariniers","Maître","CGGG"],
["M","Officiers mariniers","Second maître","CGG"],
["M","Équipage","Quartier-maître de 1re classe","CRRR"],
["M","Équipage","Quartier-maître de 2e classe","CRR"],
["M","Équipage","Matelot breveté","CR"]
];
const GOLD="#d4af37",SIL="#cfd4da",RED="#c8102e",BG={T:"#3d4b34",M:"#16294d"};
function star(x,y,r){let p="";for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.4:r;p+=(x+q*Math.cos(a)).toFixed(1)+","+(y+q*Math.sin(a)).toFixed(1)+" "}return`<polygon points="${p}" fill="${SIL}"/>`}
function svg(d){
const s=d[0],p=d[3].split("|"),m=p[0],o=p.slice(1).join("|"),k=m[0],c=m.slice(1),C={G:GOLD,S:SIL,R:RED};let g="";
if(k=="S"){const n=+c;for(let i=0;i<n;i++)g+=star(60-(n-1)*10+i*20,42,9)}
else if(k=="B"){
const n=c.length,a=o.includes("anc"),h=n*9+(n-1)*4,y0=(a?64:42)-h/2;
for(let i=0;i<n;i++)g+=`<rect x="22" y="${y0+i*13}" width="76" height="9" fill="${C[c[i]]}"${o.includes("edge")?` stroke="${SIL}" stroke-width="2"`:""}/>`;
if(o.includes("red"))g+=`<rect x="22" y="${y0+3.5}" width="76" height="2" fill="${RED}"/>`;
if(o.includes("sab"))g+=`<rect x="45" y="${y0}" width="4" height="${h}" fill="#000"/><rect x="71" y="${y0}" width="4" height="${h}" fill="#000"/>`;
if(o.includes("so1"))g+=`<rect x="22" y="${y0-5}" width="76" height="2" fill="${GOLD}"/>`;
if(o.includes("top"))g+=`<rect x="22" y="${y0-6}" width="76" height="3" fill="${GOLD}"/>`;
if(o.includes("so2"))g+=`<rect x="22" y="${y0-10}" width="76" height="2" fill="${SIL}"/><rect x="22" y="${y0-5}" width="76" height="2" fill="${GOLD}"/>`;
if(a)g+=`<path d="M60 8v34M51 16h18M44 32q16 16 32 0" stroke="${GOLD}" stroke-width="3.5" fill="none"/>`;
}else for(let i=0;i<c.length;i++){const y=36+((c.length-1)/2-i)*13;g+=`<path d="M28 ${y+12}L60 ${y}L92 ${y+12}" stroke="${C[c[i]]}" stroke-width="7" fill="none"/>`}
return`<svg viewBox="0 0 120 84" xmlns="http://www.w3.org/2000/svg" role="img"><rect width="120" height="84" rx="10" fill="${BG[s]}"/>${g}</svg>`}
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
let cfg={s:"TM",m:"i"},st,cur,O,lock,tk=0,w={};
const key=d=>d[0]+d[2];
function pick(){
const p=D.filter(d=>cfg.s.includes(d[0])&&d!==cur);
let r=Math.random()*p.reduce((a,d)=>a+(w[key(d)]||1),0);
for(const d of p){r-=w[key(d)]||1;if(r<=0)return d}
return p[0]}
function opts(q){
const o=D.filter(d=>d[0]==q[0]&&d!==q);
return sh([q,...sh(o.filter(d=>d[1]==q[1])).concat(sh(o.filter(d=>d[1]!=q[1]))).slice(0,3)])}
function stats(){$("st").textContent=`✓ ${st.ok} · ✗ ${st.ko} · série ${st.run}`}
function show(){
tk++;lock=0;cur=pick();O=opts(cur);const i=cfg.m=="i";
$("bd").textContent=cur[0]=="T"?"Armée de terre":"Marine nationale";
$("p").textContent=i?"Quel est ce grade ?":"Quel est l’insigne de ce grade ?";
$("q").innerHTML=i?svg(cur):`<div class="nm">${cur[2]}</div>`;
$("o").className=i?"o":"o g";
$("o").innerHTML=O.map(d=>`<button>${i?d[2]:svg(d)}</button>`).join("");
[...$("o").children].forEach((b,j)=>b.onclick=()=>ans(b,O[j]));
$("fb").textContent="";$("nx").hidden=true;stats()}
function ans(b,d){
if(lock)return;lock=1;
const ok=d==cur,k=key(cur),t=tk;
b.classList.add(ok?"ok":"ko");
if(!ok)[...$("o").children].forEach((x,j)=>{if(O[j]==cur)x.classList.add("ok")});
w[k]=ok?Math.max(1,(w[k]||1)-1):(w[k]||1)+3;
ok?(st.ok++,st.run++):(st.ko++,st.run=0);
$("fb").textContent=`${ok?"✓":"✗"} ${cur[2]} · ${cur[1]}`;
$("fb").style.color=ok?"var(--ok)":"var(--ko)";
$("nx").hidden=false;stats();
if(ok)setTimeout(()=>{if(t==tk)show()},1100)}
$("nx").onclick=show;
function chips(id,f){
const bs=[...$(id).children];
bs.forEach(b=>b.onclick=()=>{bs.forEach(x=>x.classList.remove("on"));b.classList.add("on");f(b.dataset.v);st={ok:0,ko:0,run:0};cur=null;show()})}
chips("cs",v=>cfg.s=v);chips("cm",v=>cfg.m=v);
st={ok:0,ko:0,run:0};show();
</script>
</body>
</html>
